version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Bundle RustCrypto updates into a single PR — they tend to release together.
    groups:
      rustcrypto:
        patterns:
          - des
          - cbc
          - cipher
          - hmac
          - sha1
          - pbkdf2
      time-stack:
        patterns:
          - time
          - chrono
      serde-stack:
        patterns:
          - serde
          - serde_json
      cli-stack:
        patterns:
          - clap
          - clap_*
          - anyhow
          - rpassword
          - dirs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    ignore:
      # `dtolnay/rust-toolchain` uses Rust version strings as refs
      # (e.g. `@1.88` means "install Rust 1.88", not "action v1.88").
      # Dependabot misreads these as semver action bumps and proposes
      # nonsensical updates like `@1.88` -> `@1.100`. Ignore version
      # updates for this action.
      - dependency-name: "dtolnay/rust-toolchain"
      # `taiki-e/install-action` is deliberately pinned to the floating `@v2`
      # major tag. It ships ~20 releases a month, so pinning an exact patch
      # would mean a bump PR nearly every workday for no safety gain: a version
      # tag is mutable too, and real supply-chain pinning needs a commit SHA.
      - dependency-name: "taiki-e/install-action"
