name: Release-plz

# Release automation via release-plz (was a tag-triggered publish). On every
# push to main, release-plz opens (or updates) a "Release PR" that bumps the
# workspace version and writes the changelog from conventional commits.
# Merging that PR makes the `release` job publish both crates to crates.io via
# OIDC Trusted Publishing, push the git tag, and create the GitHub Release.
#
# crates.io Trusted Publishing must be configured for BOTH `keychainbreaker`
# and `keychainbreaker-cli` with: Repository moonD4rk/keychainbreaker-rs,
# Workflow release.yml, environment empty (this workflow uses none).

on:
  push:
    branches: [main]

jobs:
  # Maintains the Release PR. Runs on every push but only touches the PR.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes when a crate's version in Cargo.toml is not yet on crates.io
  # (i.e. right after a Release PR merges). A no-op on ordinary pushes.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - uses: release-plz/action@v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
