name: Release

# Publishes both crates to crates.io when a `v*` tag is pushed (e.g. `v1.0.0`).
# Uses crates.io Trusted Publishing (OIDC) — no long-lived token in repo secrets.
# One-time setup: on crates.io, add this repo + workflow as a Trusted Publisher
# for each crate (configure a "pending" publisher before the first publish).
# The very first 0.2.0 release is simplest to push manually with `cargo publish`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Library first; the CLI depends on it being on the registry index.
      - run: cargo publish -p keychainbreaker
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish -p keychainbreaker-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
