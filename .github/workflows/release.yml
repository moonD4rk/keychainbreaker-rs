name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MOOND4RK_CI_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOOND4RK_CI_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.3.0)"
            exit 1
          fi

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Bump workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: cargo set-version --workspace "$VERSION"

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo update --workspace
          git config user.name "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.email }}"
          git switch -c "release/v${VERSION}"
          git commit -am "chore: release ${VERSION}"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p keychainbreaker
          cargo publish -p keychainbreaker-cli

      - name: Push branch, tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git push origin "release/v${VERSION}"
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          notes=(--generate-notes)
          [ -n "$prev" ] && notes+=(--notes-start-tag "$prev")
          gh release create "v${VERSION}" \
            --target "release/v${VERSION}" \
            --title "v${VERSION}" \
            "${notes[@]}"

      - name: Open PR to merge bump into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "chore: release ${VERSION}" \
            --body "Version bump for \`${VERSION}\`, already published to crates.io by the release workflow.")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
