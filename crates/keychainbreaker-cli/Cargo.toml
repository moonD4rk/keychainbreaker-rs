[package]
name = "keychainbreaker-cli"
description = "Command-line tool to extract credentials from macOS Keychain files."
keywords = ["macos", "keychain", "forensics", "cli"]
categories = ["command-line-utilities", "cryptography"]
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = { workspace = true }

[[bin]]
name = "keychainbreaker"
path = "src/main.rs"

[dependencies]
keychainbreaker = { path = "../keychainbreaker", version = "0.3", features = [
  "serde",
] }
clap = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
